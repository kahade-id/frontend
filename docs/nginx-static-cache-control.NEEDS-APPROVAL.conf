# Snippet cache-control untuk aset statis Kahade (NP-009, audit performa,
# 2026-09-29).
#
# STATUS: DRAF untuk review user. JANGAN di-apply ke nginx production tanpa
# persetujuan eksplisit. Perintah user: nginx production TIDAK BOLEH diubah
# oleh tim implementasi.
#
# Latar belakang (observasi read-only 2026-09-28):
# - /uploads/avatars/, /uploads/headers/, /uploads/showcase-images/,
#   /uploads/showcase-videos/ di nginx production SUDAH memakai
#   `expires 30d` + `Cache-Control "public, immutable"` — sudah sejalan
#   dengan rekomendasi ini. Snippet di bawah HANYA menutup celah yang
#   tersisa: aset fingerprinted aplikasi web (/_expo/static/*) yang saat
#   diperiksa mengembalikan `Cache-Control: public, max-age=0,
#   must-revalidate` (CF-Cache-Status: MISS).
# - Generic /uploads/ mengembalikan 404 (sudah benar — direktori tak
#   dikenal tidak terekspos).
# - Direktori staging upload chunked (NP-006: <storage>/.chunks/) TIDAK
#   BOLEH diserve — pastikan tidak ada location yang mengekspos path
#   bertitik tersebut (tidak ada di snippet ini by design).
#
# Prinsip keamanan yang DIPERTAHANKAN dari blok upload existing:
# - CSP sandbox untuk konten upload publik.
# - X-Content-Type-Options: nosniff.
# - Blokir ekstensi script (.php/.pl/.py/.sh/.cgi/.html/.htm/.js/.svg).
# - Hanya folder upload PUBLIK yang diserve; prefix tak dikenal → 404.
#
# Cara verifikasi setelah di-apply (dengan persetujuan):
#   sudo nginx -t && sudo systemctl reload nginx
#   curl -sI -H "Host: api.kahade.id" https://127.0.0.1/_expo/static/js/web/<hash>.js \
#     | grep -i "cache-control"
#   # ekspektasi: Cache-Control: public, max-age=31536000, immutable
#   curl -sI -H "Host: api.kahade.id" https://127.0.0.1/uploads/showcase-videos/x.mp4 \
#     | grep -i "cache-control"
#   # ekspektasi: tidak berubah (public, immutable, 30d) + CSP sandbox tetap ada
# ============================================================================

# Aset fingerprinted Expo web — nama file mengandung hash konten, jadi aman
# di-cache agresif. HANYA untuk path fingerprinted; index.html / route HTML
# TIDAK BOLEH immutable (harus tetap must-revalidate agar deploy baru
# langsung terlihat).
location ^~ /_expo/static/ {
    # Fingerprinted bundle: 1 tahun immutable.
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Aset build tidak boleh dieksekusi sebagai dokumen aktif.
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'" always;

    # Blokir ekstensi script bila ada yang nyasar ke direktori ini.
    location ~* \.(php|pl|py|sh|cgi|html?|svg)$ {
        return 404;
    }

    try_files $uri =404;
}

# Catatan: untuk blok /uploads/* yang sudah ada (avatars, headers,
# showcase-images, showcase-videos) TIDAK ADA perubahan — konfigurasi
# production saat ini (expires 30d + public, immutable + CSP sandbox +
# blokir ekstensi script) sudah memenuhi rekomendasi NP-009.
